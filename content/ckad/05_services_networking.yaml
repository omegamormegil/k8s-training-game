id: ckad-05-services-networking
title: "Services & Networking"
exam: CKAD
weight: 20
objectives:
  - id: ckad-05-service-discovery
    title: "Demonstrate basic understanding of NetworkPolicies and Services for app-to-app communication"
    tasks:
      - id: ckad-05-svc-t1
        prompt: |
          Create a Deployment named `api` in `game-lab` (image `nginx:1.25`,
          2 replicas, will get label `app=api` automatically), then expose
          it as a ClusterIP Service named `api` on port `8080` targeting
          container port `80`.
        hints:
          - "kubectl create deployment api --image=nginx:1.25 --replicas=2 -n game-lab"
          - "kubectl expose deployment api --port=8080 --target-port=80 --name=api -n game-lab"
        cleanup:
          - "kubectl delete deployment api -n game-lab --ignore-not-found"
          - "kubectl delete service api -n game-lab --ignore-not-found"
        checks:
          - type: resource_exists
            kind: service
            name: api
            namespace: game-lab
          - type: jsonpath_equals
            kind: service
            name: api
            namespace: game-lab
            jsonpath: "{.spec.ports[0].port}"
            expected: 8080
          - type: jsonpath_equals
            kind: service
            name: api
            namespace: game-lab
            jsonpath: "{.spec.ports[0].targetPort}"
            expected: 80
        exam_tip: "port is what clients connect to; targetPort is what the container actually listens on — they don't have to match."

      - id: ckad-05-app-to-app-t1
        prompt: |
          Create a Pod named `client` in `game-lab` (image `busybox:1.36`,
          command `sleep 3600`) and confirm it can reach the `api` Service
          from the previous task by DNS name, on port 8080.
        hints:
          - "kubectl run client --image=busybox:1.36 -n game-lab --command -- sleep 3600"
          - "kubectl exec client -n game-lab -- wget -qO- http://api.game-lab.svc.cluster.local:8080"
        cleanup:
          - "kubectl delete pod client -n game-lab --ignore-not-found"
        checks:
          - type: resource_exists
            kind: pod
            name: client
            namespace: game-lab
          - type: command_output_contains
            command: "kubectl exec client -n game-lab -- wget -qO- --timeout=10 http://api.game-lab.svc.cluster.local:8080"
            expected: "nginx"
        exam_tip: "Same-namespace calls can drop the namespace suffix entirely (just 'http://api:8080') — the FQDN is only required cross-namespace."

  - id: ckad-05-ingress
    title: "Provide and troubleshoot access to applications via Ingress"
    tasks:
      - id: ckad-05-ing-t1
        prompt: |
          Create an Ingress named `api-ingress` in `game-lab` routing host
          `api.local` path `/` to the `api` Service on port 8080.
        hints:
          - >
            apiVersion: networking.k8s.io/v1
            kind: Ingress
            metadata:
              name: api-ingress
              namespace: game-lab
            spec:
              rules:
                - host: api.local
                  http:
                    paths:
                      - path: /
                        pathType: Prefix
                        backend:
                          service:
                            name: api
                            port:
                              number: 8080
        cleanup:
          - "kubectl delete ingress api-ingress -n game-lab --ignore-not-found"
        checks:
          - type: resource_exists
            kind: ingress
            name: api-ingress
            namespace: game-lab
          - type: jsonpath_equals
            kind: ingress
            name: api-ingress
            namespace: game-lab
            jsonpath: "{.spec.rules[0].http.paths[0].backend.service.port.number}"
            expected: 8080
        exam_tip: "kubectl create ingress api-ingress --rule='api.local/=api:8080' -n game-lab can generate this in one line — faster than YAML under time pressure."

  - id: ckad-05-multi-port
    title: "Define and expose multi-port containers and Services"
    tasks:
      - id: ckad-05-multiport-t1
        prompt: |
          Create a Pod named `multi-port` in `game-lab` (image `nginx:1.25`)
          declaring two container ports: `80` named `http` and `443` named
          `https`.
        hints:
          - >
            ports:
              - {containerPort: 80, name: http}
              - {containerPort: 443, name: https}
        cleanup:
          - "kubectl delete pod multi-port -n game-lab --ignore-not-found"
        checks:
          - type: jsonpath_equals
            kind: pod
            name: multi-port
            namespace: game-lab
            jsonpath: "{.spec.containers[0].ports[0].name}"
            expected: "http"
          - type: jsonpath_equals
            kind: pod
            name: multi-port
            namespace: game-lab
            jsonpath: "{.spec.containers[0].ports[1].name}"
            expected: "https"
        exam_tip: "Named ports let a Service's targetPort reference the name (e.g. 'http') instead of a hardcoded number, decoupling the two."
